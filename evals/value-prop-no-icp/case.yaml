schema_version: "1.1"
name: value-prop-no-icp
description: value-prop with the ICP section still a placeholder stops, names define-icp, and leaves the Profile unchanged.
tags: [value-prop]
runs: 1
context:
  scaffold_script: profile-without-icp.sh
execution:
  max_turns: 10
  allowed_tools: [Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    /gtm-playbook:value-prop

    Our Value proposition: Shiplog writes your customer changelog from merged PRs in seconds, ten times faster than writing release notes by hand. Take my answers as final and write it without asking me to confirm.
graders:
  - name: names-define-icp
    type: regex
    pattern: 'define-icp'
  - name: value-proposition-still-empty
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## Value proposition\s+Owner: value-prop\s+Last revised: 2026-01-05\s+_Not defined yet\. Run `/gtm-playbook:value-prop`\._\s+## Outcome positioning'
  - name: nothing-written
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: nothing-edited
    type: tool_used
    tool: Edit
    min: 0
    max: 0
