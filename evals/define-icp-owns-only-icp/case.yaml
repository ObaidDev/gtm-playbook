schema_version: "1.1"
name: define-icp-owns-only-icp
description: define-icp writes the ICP section with its platform and moves its date, and leaves every other Profile section and its date unchanged.
tags: [define-icp]
runs: 1
context:
  scaffold_script: existing-profile.sh
execution:
  max_turns: 15
  allowed_tools: [Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    /gtm-playbook:define-icp

    Our ICP is heads of product at 20 to 200 person B2B SaaS companies who ship weekly. Their urgent, important problem: customers churn because they never hear what changed, and writing release notes eats a day a week. They spend their time on LinkedIn. Take my answers as final and write the ICP without asking me to confirm.
graders:
  - name: icp-filled
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## ICP\s+Owner: define-icp\s+Last revised: \d{4}-\d{2}-\d{2}\s+(?!_Not defined yet)[^#]*heads of product[^#]*## Value proposition'
    flags: i
  - name: icp-platform-linkedin
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '\*\*Platform:\*\*\s*LinkedIn\b'
  - name: icp-date-moved-on
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## ICP\s+Owner: define-icp\s+Last revised: 2026-01-05'
    match: not_contains
  - name: product-unchanged
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## Product\s+Owner: setup-gtm\s+Last revised: 2026-01-05\s+\*\*Product:\*\* Shiplog turns merged pull requests into customer-facing changelogs for B2B SaaS teams\.\s+\*\*Product stage:\*\* beta\s+## ICP'
  - name: value-proposition-unchanged
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## Value proposition\s+Owner: value-prop\s+Last revised: 2026-02-12\s+Shiplog writes your customer changelog from merged PRs in seconds, so product teams stop losing a day a week to release notes\.\s+## Outcome positioning'
  - name: outcome-positioning-unchanged
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## Outcome positioning\s+Owner: outcome-positioning\s+Last revised: 2026-01-05\s+_Not defined yet\. Run `/gtm-playbook:outcome-positioning`\._\s+## Pricing'
  - name: pricing-unchanged
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## Pricing\s+Owner: outcome-pricing\s+Last revised: 2026-01-05\s+_Not defined yet\. Run `/gtm-playbook:outcome-pricing`\._\s*$'
  - name: no-duplicated-sections
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '^## ICP\s*$'
    flags: m
    match: count:1
  - name: no-other-gtm-file-written
    type: file_exists
    path: 'gtm/**'
    exists: false
