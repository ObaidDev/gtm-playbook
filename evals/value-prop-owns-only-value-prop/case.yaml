schema_version: "1.1"
name: value-prop-owns-only-value-prop
description: value-prop writes the Value proposition section and moves its date, and leaves every other Profile section and its date unchanged.
tags: [value-prop]
runs: 1
context:
  scaffold_script: existing-profile.sh
execution:
  max_turns: 15
  allowed_tools: [Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    /gtm-playbook:value-prop

    Today our ICP writes release notes by hand from Jira tickets, which takes a full day every week. Shiplog drafts the customer changelog from merged pull requests in under a minute, and the head of product only reviews it. Our Value proposition: Shiplog writes your customer changelog from merged PRs in a minute instead of a day, so product teams tell every customer what changed without losing a day a week. Take my answers as final and write it without asking me to confirm.
graders:
  - name: value-proposition-filled
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## Value proposition\s+Owner: value-prop\s+Last revised: \d{4}-\d{2}-\d{2}\s+\*\*Value proposition:\*\*[^#]*changelog[^#]*\*\*Alternatives:\*\*[^#]*\*\*Measure:\*\*[^#]*## Outcome positioning'
    flags: i
  - name: value-proposition-date-moved-on
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## Value proposition\s+Owner: value-prop\s+Last revised: 2026-01-05'
    match: not_contains
  - name: product-unchanged
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## Product\s+Owner: setup-gtm\s+Last revised: 2026-01-05\s+\*\*Product:\*\* Shiplog turns merged pull requests into customer-facing changelogs for B2B SaaS teams\.\s+\*\*Product stage:\*\* beta\s+\*\*Sales motion:\*\* product-led\s+## ICP'
  - name: icp-unchanged
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## ICP\s+Owner: define-icp\s+Last revised: 2026-01-20\s+\*\*Who:\*\* Heads of product at 20 to 200 person B2B SaaS companies who ship weekly\.\s+\*\*Segment:\*\* mid-market\s+\*\*Urgent and important problem:\*\* Customers churn because they never hear what changed, and writing release notes by hand eats a day a week\.\s+\*\*Early adopters:\*\* Heads of product at SaaS companies that ship daily and already write a changelog by hand every week\.\s+\*\*Platform:\*\* LinkedIn\s+\*\*Lead stage:\*\* How do you tell customers what shipped today\? ICP lead: we write release notes or a changelog by hand\. Not ICP: we do not tell customers, or a tool already writes it\.\s+## Value proposition'
  - name: outcome-positioning-unchanged
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## Outcome positioning\s+Owner: outcome-positioning\s+Last revised: 2026-03-02\s+\*\*Outcome:\*\* Risk reduction: less churn, because every customer hears what changed the day it ships\.\s+\*\*Show the work:\*\* A finished changelog email landing in a customer''s inbox minutes after a merge\.\s+\*\*Context and harness:\*\* Reads the linked tickets and past changelogs, and checks every entry against what merged\.\s+\*\*Integrations:\*\* GitHub, Linear, an MCP server, and a Slack approval by the head of product\.\s+## Pricing'
  - name: pricing-unchanged
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '## Pricing\s+Owner: outcome-pricing\s+Last revised: 2026-01-05\s+_Not defined yet\. Run `/gtm-playbook:outcome-pricing`\._\s*$'
  - name: no-duplicated-sections
    type: regex
    target: { source: file, path: gtm/profile.md }
    pattern: '^## Value proposition\s*$'
    flags: m
    match: count:1
